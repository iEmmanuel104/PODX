version: '3.8'

services:
  postgres:
      image: postgres:latest
      container_name: podx_postgres_db
      restart: always
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: myuser
        POSTGRES_PASSWORD: mypassword
        POSTGRES_DB: mydatabase
      volumes:
        - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:latest
    container_name: podx_mongo_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: podx_admin
      MONGO_INITDB_ROOT_PASSWORD: podx_admin_pass
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:latest
    container_name: podx_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  mongodata:
  redisdata:
